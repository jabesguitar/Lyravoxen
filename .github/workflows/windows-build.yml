name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/Lyravoxen.Desktop/Lyravoxen.Desktop.csproj
      - name: Build
        run: dotnet publish src/Lyravoxen.Desktop/Lyravoxen.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-x64
      - name: Test cue timeline
        run: dotnet run --project tests/Lyravoxen.TimelineTests/Lyravoxen.TimelineTests.csproj -c Release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/Lyravoxen-Windows-x64-portable.zip -CompressionLevel Optimal
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Lyravoxen-Windows-x64
          path: artifacts/windows-x64/
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Lyravoxen-Windows-x64-portable
          path: artifacts/Lyravoxen-Windows-x64-portable.zip
