name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/Lyravoxen.Desktop/Lyravoxen.Desktop.csproj
      - name: Build
        run: dotnet publish src/Lyravoxen.Desktop/Lyravoxen.Desktop.csproj -c Release -r win-x64 --self-contained false -o artifacts/windows-x64
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Lyravoxen-Windows-x64
          path: artifacts/windows-x64/
