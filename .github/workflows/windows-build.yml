name: Windows build

concurrency:
  group: lyravoxen-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, redesign/brand-visual-layer, feature/offline-library-on-redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

jobs:
  cloud-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Setup .NET for offline media tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test offline media service
        run: dotnet run --project tests/Lyravoxen.OfflineTests/Lyravoxen.OfflineTests.csproj -c Release
      - name: Check Help coverage
        run: python tests/help_coverage.py
      - name: C# static checks
        run: python tests/csharp_lint.py
      - name: Extract and test Cloudflare Worker
        working-directory: tests/js
        run: |
          python extract.py
          node worker.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/lyravoxen-playwright playwright
          npx --yes --package=playwright playwright install --with-deps chromium
      - name: Test public request form
        working-directory: tests/js
        env:
          PW_MODULES: /tmp/lyravoxen-playwright/node_modules
        run: |
          python extract.py
          node forms.test.mjs
      - name: Test mobile remote page
        working-directory: tests/js
        env:
          PW_MODULES: /tmp/lyravoxen-playwright/node_modules
        run: |
          python extract.py
          node phone.test.mjs

  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/offline-library-on-redesign'
    needs: cloud-worker-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate application icon
        shell: pwsh
        run: ./tools/New-AppIcon.ps1
      - name: Generate compact Windows splash
        shell: pwsh
        run: ./tools/New-Splash.ps1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/Lyravoxen.Desktop/Lyravoxen.Desktop.csproj
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build native adblock engine
        run: cargo build --manifest-path native/adblock/Cargo.toml --release --target x86_64-pc-windows-msvc
      - name: Build
        run: dotnet publish src/Lyravoxen.Desktop/Lyravoxen.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows-x64
      - name: Bundle native adblock engine
        shell: pwsh
        run: |
          Copy-Item native/adblock/target/x86_64-pc-windows-msvc/release/lyravoxen_adblock.dll artifacts/windows-x64/lyravoxen_adblock.dll
      - name: Download and bundle official uBlock Origin Lite (Edge) extension
        shell: pwsh
        run: |
          $version = "2026.1124.1811"
          $url = "https://github.com/uBlockOrigin/uBOL-home/releases/download/$version/uBOLite_$version.edge.zip"
          $zip = Join-Path $env:RUNNER_TEMP "uBOLite.zip"
          $extract = Join-Path $env:RUNNER_TEMP "uBOLite"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $manifest = Get-ChildItem -Path $extract -Filter manifest.json -Recurse | Select-Object -First 1
          if (-not $manifest) { throw "uBlock Origin Lite manifest.json not found in release archive." }
          $extensionDir = Join-Path $PWD "artifacts/windows-x64/Extensions/uBOLite"
          New-Item -ItemType Directory -Force -Path $extensionDir | Out-Null
          Copy-Item -Path (Join-Path $manifest.DirectoryName "*") -Destination $extensionDir -Recurse -Force
          if (-not (Test-Path (Join-Path $extensionDir "manifest.json"))) { throw "Extension bundle did not contain manifest.json at its root." }
          $licenseUrl = "https://raw.githubusercontent.com/uBlockOrigin/uBOL-home/$version/LICENSE"
          try { Invoke-WebRequest -Uri $licenseUrl -OutFile (Join-Path $extensionDir "LICENSE.txt") } catch { Write-Warning "Could not retrieve upstream license file; verify release licensing before distribution." }
      - name: Test cue timeline
        run: dotnet run --project tests/Lyravoxen.TimelineTests/Lyravoxen.TimelineTests.csproj -c Release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/Lyravoxen-Windows-x64-portable.zip -CompressionLevel Optimal
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Lyravoxen-Windows-x64
          path: artifacts/windows-x64/
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Lyravoxen-Windows-x64-portable
          path: artifacts/Lyravoxen-Windows-x64-portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/Lyravoxen.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Lyravoxen-Installer-Windows-x64
          path: artifacts/installer/Lyravoxen-Setup-Windows-x64.exe
